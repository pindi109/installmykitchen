[build]
  # Netlify builds from source on every push. All SEO fixes live in src/ —
  # never patch dist/ directly, a rebuild will overwrite it.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Legacy standalone kitchen-fitter-{location} pages from the original build
# superseded by the templated /fitter/{location}/ route — same target keyword,
# same content angle. Consolidate into the templated page rather than leave
# both live and competing for the same query.
[[redirects]]
  from = "/kitchen-fitter-bedworth/"
  to = "/fitter/bedworth/"
  status = 301

[[redirects]]
  from = "/kitchen-fitter-coventry/"
  to = "/fitter/coventry/"
  status = 301

